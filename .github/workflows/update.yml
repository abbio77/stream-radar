name: Aggiorna Stream Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check Italian time
        id: time
        shell: bash
        run: |
          HOUR=$(TZ=Europe/Rome date +%H)
          if [ "$HOUR" = "20" ]; then
            echo "run_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_update=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Update streaming catalog
        if: steps.time.outputs.run_update == 'true' || github.event_name == 'workflow_dispatch'
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: python scripts/update.py
      - name: Commit updated data
        if: steps.time.outputs.run_update == 'true' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna catalogo Stream Radar'
            git push
          fi
