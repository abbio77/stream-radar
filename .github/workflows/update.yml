name: Aggiorna Stream Radar

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'audio-evidence.json'
      - '.github/workflows/update.yml'
      - 'app.js'
      - 'sw.js'
  schedule:
    - cron: '0 18 * * *'
    - cron: '0 19 * * *'

permissions:
  contents: write

concurrency:
  group: stream-radar-catalog
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify collector and interface
        run: |
          python -m unittest discover -s tests -v
          node --check app.js
          node --check sw.js
          node --test tests/test_app.cjs
      - name: Check Italian date
        id: time
        shell: bash
        run: |
          TODAY=$(TZ=Europe/Rome date +%F)
          UPDATED=$(python -c "import json; print(json.load(open('data.json')).get('updated_at','')[:10])")
          HOUR=$(TZ=Europe/Rome date +%H)
          if [ "$HOUR" -ge 20 ] && [ "$TODAY" != "$UPDATED" ]; then
            echo 'run_update=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Update streaming catalog
        if: steps.time.outputs.run_update == 'true' || github.event_name != 'schedule'
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: python scripts/update.py
      - name: Commit updated data
        if: steps.time.outputs.run_update == 'true' || github.event_name != 'schedule'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna catalogo Stream Radar'
            git pull --rebase origin main
            git push
          fi
